# Netlify builds the site from src/ (see eleventy.config.js) and publishes _site/.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# /v3 was the test version of the new home page; it is now the home page.
[[redirects]]
  from = "/v3/*"
  to = "/"
  status = 301
