          - {label: Intro, name: intro, widget: text}
          - {label: Email line, name: email_prompt, widget: string, hint: "Your email address follows this (set it in Site settings)."}
          - {label: Button, name: button, widget: string, hint: "After this, visitors go to your Calendly with their name and email filled in. The service checkboxes and “How did you hear about me?” choices come from How I Can Help and the Contact page."}
