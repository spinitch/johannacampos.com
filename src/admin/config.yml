# Sveltia CMS (reads Decap CMS config) — the editor at johannacampos.com/admin
# Saving in the editor commits to main on GitHub. skip_ci adds [skip ci] to
# those commits so Netlify does NOT rebuild on every save (each build costs
# Netlify credits); press "Publish Changes" in the editor when you're done and
# it rebuilds once. That button needs a Netlify build hook URL, pasted into the
# editor under Account > Settings > Advanced.
backend:
  name: github
  repo: spinitch/johannacampos.com
  branch: main
  skip_ci: true
  commit_messages:
    update: "Update {{slug}} (via CMS)"
    uploadMedia: "Upload {{path}} (via CMS)"
    deleteMedia: "Delete {{path}} (via CMS)"

# To edit local files instead: `npm start`, open localhost:8080/admin and
# choose "Work with Local Repository".

site_url: https://johannacampos.com
display_url: https://johannacampos.com
logo_url: /assets/img/logo-mark.png

# New uploads land in assets/img; existing pictures live in its subfolders.
media_folder: assets/img
public_folder: /assets/img

# The preview pane can't show the site's layout, so it's switched off.
editor:
  preview: false

collections:
  - label: Pages
    name: pages
    files:
      - label: Home
        name: home
        file: src/_data/home.yml
        fields:
          - {label: Browser tab title, name: page_title, widget: string}
          - {label: Search description, name: description, widget: text, hint: "One or two sentences shown in Google results."}
          - {label: Link-preview description, name: share_description, widget: text, hint: "Shown when the site is shared on LinkedIn, Slack, etc."}
          - label: North Star (not shown while the animated hero is live)
            name: north_star
            widget: object
            fields:
              - {label: Eyebrow, name: eyebrow, widget: string}
              - {label: Quote, name: quote, widget: text, hint: "Wrap words in **double asterisks** to give them the orange underline."}
              - {label: Attribution, name: attribution, widget: string}
          - label: Animated hero (the home page)
            name: hero_v3
            widget: object
            collapsed: true
            fields:
              - {label: Headline beside the phone, name: before, widget: text, hint: "Press Return for a line break."}
              - {label: Headline beside the photos, name: after, widget: text, hint: "Press Return for a line break. Wrap words in **double asterisks** to make them orange."}
              - {label: Button, name: button, widget: string}
              - {label: Button link, name: button_link, widget: string, hint: "#intro scrolls to the intro paragraph below the hero."}
          - label: Opening paragraph (above the intro)
            name: lead
            widget: object
            fields:
              - {label: Text, name: text, widget: text, required: false, hint: "Shown larger, right above the intro paragraphs. Leave empty to hide it. Wrap words in **double asterisks** for bold."}
              - {label: Size, name: size, widget: select, default: xl, options: [{label: "Large (26px)", value: l}, {label: "Extra large (30px)", value: xl}, {label: "Huge (36px)", value: xxl}]}
          - {label: Intro, name: intro, widget: text, hint: "Press Return for a line break; leave a blank line to start a new paragraph."}
          - {label: Intro alignment, name: intro_align, widget: select, default: center, options: [{label: Centered, value: center}, {label: Left, value: left}, {label: Right, value: right}], hint: "On phones the intro is always left-aligned so it's easier to read."}
          - label: Book a call (under the service cards)
            name: book
            widget: object
            fields:
              - {label: Eyebrow, name: eyebrow, widget: string}
              - {label: Heading, name: heading, widget: string}
              - {label: Button, name: button, widget: string, hint: "The booking link itself is in Site settings."}
          - label: About Me (black band)
            name: about
            widget: object
            fields:
              - {label: Heading, name: heading, widget: string}
              - {label: Text, name: body, widget: markdown, minimal: true, buttons: [bold, italic, link], editor_components: [], hint: "Leave a blank line between paragraphs."}
              - {label: Button, name: button, widget: string}
              - {label: Photo, name: photo, widget: image, hint: "Shown as a circle; use a square photo."}
              - {label: Photo alt text, name: photo_alt, widget: string}

      - label: Chat (test home page at /v2)
        name: chat
        file: src/_data/chat.yml
        fields:
          - {label: Heading above the chat, name: eyebrow, widget: string}
          - {label: Name, name: name, widget: string}
          - {label: Status line, name: status, widget: string, hint: "Small grey text under your name."}
          - {label: Photo, name: avatar, widget: image, hint: "Shown as a circle; use a square photo."}
          - label: Greeting (by the visitor’s time of day)
            name: greetings
            widget: object
            fields:
              - {label: Before noon, name: morning, widget: string}
              - {label: Noon to 6 pm, name: afternoon, widget: string}
              - {label: After 6 pm, name: evening, widget: string}
          - {label: First question, name: opening, widget: text, hint: "Follows the greeting. A blank line makes a second message bubble."}
          - {label: After each answer, name: more_prompt, widget: text}
          - {label: When every question has been asked, name: done_prompt, widget: text}
          - {label: Start-over button, name: restart_label, widget: string}
          - {label: Booking button, name: book_label, widget: string, hint: "Opens the Calendly link from Site settings."}
          - label: Leave me a note
            name: note
            widget: object
            collapsed: true
            hint: "A short back-and-forth that emails you the visitor’s name, what they do, their email and their note (same form as the Contact page). {name} is replaced with the visitor’s name."
            fields:
              - {label: Button, name: chip, widget: string}
              - {label: What the visitor says, name: you_say, widget: string}
              - {label: Ask for their name, name: ask_name, widget: text}
              - {label: Ask what they do (optional for them), name: ask_about, widget: text}
              - {label: Ask for their email, name: ask_email, widget: text}
              - {label: Ask for the note, name: ask_message, widget: text}
              - {label: Thank-you, name: thanks, widget: text}
              - {label: If sending fails, name: error, widget: text, hint: "{email} becomes your email address (from Site settings)."}
              - {label: Skip button, name: skip_label, widget: string}
              - {label: Send button, name: send_label, widget: string}
          - label: Questions
            name: topics
            widget: list
            summary: "{{fields.question}}"
            collapsed: true
            hint: "Visitors tap a question and get your answer. Drag to reorder."
            fields:
              - {label: Question (what the visitor taps), name: question, widget: string}
              - {label: Your answer, name: answer, widget: text, hint: "Each paragraph (blank line between) is its own message bubble. **double asterisks** = bold; links: [words](about.html)"}
              - label: Buttons after the answer
                name: buttons
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - {label: Button text, name: label, widget: string}
                  - {label: Link, name: link, widget: string, hint: "A page like about.html, how-i-can-help.html#design-deliver, or #work for the work grid on this page."}
              - {label: Add the booking button, name: book, widget: boolean, default: false, required: false}

      - label: How I Can Help (and the home page service cards)
        name: services
        file: src/_data/offerings.yml
        fields:
          - {label: Browser tab title, name: page_title, widget: string}
          - {label: Search description, name: description, widget: text}
          - {label: Heading, name: heading, widget: string}
          - label: Services
            name: items
            widget: list
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Each service is a tab on How I Can Help and a card on the home page."
            fields:
              - {label: Name, name: name, widget: string, hint: "Written as “First + Second”; the + turns orange."}
              - {label: Link name, name: slug, widget: string, pattern: ["^[a-z0-9-]+$", "Lowercase letters, numbers and dashes only"], hint: "Used in links like how-i-can-help.html#design-deliver. Changing it breaks old links."}
              - {label: Home page card text, name: card_summary, widget: text}
              - {label: Opening paragraph, name: preamble, widget: markdown, minimal: true, buttons: [bold, italic, link], editor_components: [], hint: "One paragraph."}
              - {label: Who it’s for, name: who_for, widget: markdown, minimal: true, buttons: [bold, italic, link], editor_components: []}
              - {label: What you get — intro sentence, name: what_intro, widget: text, required: false}
              - label: What you get — list
                name: what_items
                widget: list
                required: false
                summary: "{{fields.title}}"
                hint: "Leave the list empty to hide the whole What you get section."
                fields:
                  - {label: Title, name: title, widget: string, hint: "Bold, e.g. “Research:”"}
                  - {label: Text, name: body, widget: text, hint: "Starts on the line below the title. Links: [words](page.html)"}
              - {label: Case study, name: case_study, widget: markdown, minimal: true, buttons: [bold, italic, link], editor_components: [], hint: "Leave a blank line between paragraphs."}

      - label: About
        name: about
        file: src/_data/about.yml
        fields:
          - {label: Browser tab title, name: page_title, widget: string}
          - {label: Search description, name: description, widget: text}
          - {label: Heading, name: heading, widget: string}
          - label: Number cards
            name: stats
            widget: list
            summary: "{{fields.number}} {{fields.label}}"
            fields:
              - {label: Number, name: number, widget: string}
              - {label: Label, name: label, widget: string}
              - {label: Details, name: detail, widget: string, required: false}
              - {label: Small picture, name: image, widget: image, required: false, hint: "Optional, shown instead of details."}
              - {label: Picture alt text, name: image_alt, widget: string, required: false}
          - label: Closing card (wide)
            name: closing
            widget: object
            fields:
              - {label: Number, name: number, widget: string}
              - {label: Text, name: text, widget: text, hint: "Wrap words in **double asterisks** to make them bold."}
              - {label: Photo, name: photo, widget: image}
              - {label: Photo alt text, name: photo_alt, widget: string}

      - label: Contact
        name: contact
        file: src/_data/contact.yml
        fields:
          - {label: Browser tab title, name: page_title, widget: string}
          - {label: Search description, name: description, widget: text}
          - {label: Eyebrow, name: eyebrow, widget: string}
          - {label: Heading, name: heading, widget: string}
          - {label: Intro, name: intro, widget: text}
          - {label: Email line, name: email_prompt, widget: string, hint: "Your email address follows this (set it in Site settings)."}
          - {label: “How did you hear about me?” choices, name: sources, widget: list, field: {label: Choice, name: choice, widget: string}}
          - {label: Thank-you heading, name: thank_you_heading, widget: string}
          - {label: Thank-you text, name: thank_you_text, widget: text, hint: "A LinkedIn link follows this."}

      - label: Book a call (form before Calendly)
        name: book
        file: src/_data/book.yml
        fields:
          - {label: Browser tab title, name: page_title, widget: string}
          - {label: Search description, name: description, widget: text}
          - {label: Eyebrow, name: eyebrow, widget: string}
