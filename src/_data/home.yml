intro: |-
  I diagnose, design, and direct, right alongside you. 

  I’ve sat on both sides of the table. Inside a health system, I worked with clinicians, product and engineering teams, and operations leaders to build internal tools and decide which systems to bring in. I’ve also led teams that built consumer health tools used by millions. 

  Either way, I ask the same question: does it work, or does it create more friction? 
  I bring 25+ years of healthcare experience and the judgment to know what matters.

  [Let's build something together!](#services)
