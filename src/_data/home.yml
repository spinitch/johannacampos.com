intro: |-
  Most products keep you scrolling, either on purpose or by accident, through friction and confusion dressed up as features. I create simple, intuitive designs;  you get what you need and move on. 

  Great design involves a meticulous dissection of what problem is it solving for, the ideation and execution. It doesn't happen like magic but an orchestration of people, processes and understanding what technology to leverage.  

  I've built for people and for businesses. External and internal tools. Same simple question: does it work or does it create more friction?

  I've spent the last 25+ years building and creating and collaborating with amazing humans. I feel like I'm just getting started.
