page_title: Johanna Campos — Product & Design Leader
description: Product strategy and design leadership for teams that need senior judgment and builders who need their product to land.
share_description: Simpler products mean less time on a screen, more time being human. Fractional design executive and founder of Lakatta.
north_star:
  eyebrow: My North Star
  quote: '**Simpler products** mean less time on a screen, **more time being human**. That’s what I design toward, for a Fortune 500 platform or a startup’s first release.'
  attribution: Johanna Campos
intro: |-
  You might be wondering why I have images of people on my website when my craft is in designing digital experiences.  For me, technology has always been just a tool.  Yes, it's exciting to be able to create and build in a fraction of the time and resources as a couple of years ago. And as the technology improves over time, the intentionality we bring into how we design our digital experiences becomes even more important. Our humanity should be front and center. Our humanity should be the guiding light in how we design the next generation of tools.


  Most products keep you scrolling, either on purpose or by accident, through friction and confusion dressed up as features. I design the opposite way; simple enough that you get what you need and move on. Good design isn’t just about making things look pretty. It’s about making things simple to use, understanding the system that affect us, and making it delightful to use. That’s one of the most underused business levers there is, and it’s the standard I hold every project to, mine included.
