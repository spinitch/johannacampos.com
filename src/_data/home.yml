description: Product strategy and design leadership for teams that need senior judgment and builders who need their product to land.
share_description: Simpler products mean less time on a screen, more time being human. Fractional design executive and founder of Lakatta.

north_star:
  eyebrow: My North Star
  # **double asterisks** = orange underline
  quote: "**Simpler products** mean less time on a screen, **more time being human**. That’s what I design toward, for a Fortune 500 platform or a startup’s first release."
  attribution: Johanna Campos

intro: Most products keep you scrolling, either on purpose or by accident, through friction and confusion dressed up as features. I design the opposite way; simple enough that you get what you need and move on. Good design isn’t just about making things look pretty. It’s about making things simple to use, and delightful when you use them. That’s one of the most underused business levers there is, and it’s the standard I hold every project to, mine included.

