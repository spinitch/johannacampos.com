lead:
  text: '**Your design partner for the complexities of healthcare.**'
  size: xxl
intro: |-
  I diagnose, design, and direct, right alongside you.

  I've sat on both sides of the table. I've been in the trenches with clinicians, product and engineering teams, and operations leaders, building internal tools and evaluating which systems to bring in. I've also led teams that built consumer health tools used by millions. Internal or external, for people or for businesses, I ask the same simple question: does it work, or does it create more friction?

  Most products keep you scrolling, on purpose or by accident, through friction and confusion dressed up as features. I help teams figure out what actually needs to exist, then make sure it's simple enough that people get what they need and move on.

  Great design doesn't happen like magic. It starts with a meticulous dissection of the problem, then moves through ideation and execution. It's an orchestration of people, process, and knowing which technology to leverage.

  I bring 25+ years of healthcare experience, the judgment to know what matters, and a deep love for the people who use these tools. I've spent those years building alongside amazing humans, and I feel like I'm just getting started. 

  [Let's build something together!](#services)
