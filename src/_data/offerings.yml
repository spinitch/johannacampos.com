page_title: How I Can Help — Johanna Campos
description: 'Three ways to work together: Dissect + Diagnose, Design + Deliver, and Direct + Develop.'
heading: How I Can Help
items:
  - name: Dissect + Diagnose
    slug: dissect-diagnose
    card_summary: A fixed-scope audit using human-centered design methods. You’ll walk away knowing exactly what to prioritize next.
    preamble: "**Dissect + Diagnose** is designed to help you get clarity on where your product is and where it needs to be. Have you fallen in love with your customers problems? I'll do a deep dive into your current process, research and metrics. I'll help you validate some of the assumptions using human centered design methodologies."
    who_for: Founders and teams ready to move to the next phase and want an outside, senior perspective to make sure they’re building on solid ground, as well as those who sense something’s off but can’t quite pinpoint what, and founders with an idea who want to pressure-test it before writing a line of code.
    what_intro: 'The exact mix depends on where you are and what you’re trying to learn, but the work generally moves through three stages:'
    what_items:
      - title: 'Research:'
        body: Interviews with the right stakeholders and users, journey mapping, and a UX audit of how the experience actually works across touchpoints and environments.
      - title: 'Diagnosis:'
        body: A clear-eyed evaluation of what’s working and what isn’t, with findings named and ranked by impact.
      - title: 'Recommendations:'
        body: Fixes you can act on immediately, and the bigger strategic moves worth considering, delivered as a written report with an optional debrief.
    case_study: |-
      For an AI clinical platform preparing to commercialize, I was brought in to assess its commercial viability. The team had already done strong work tuning the model for accuracy, working with talented data scientists to get the numbers right. What hadn’t been tested was direction.

      Physician interviews told a different story than the model metrics did. The tool didn’t have a clear point of view on who it was for or what problem it solved first. People used it anyway, mostly because it was there and it was free, but the frustration was real and consistent across roles. My recommendation was to treat product strategy and user experience as the next phase of the work, not an afterthought to a technically strong model.

      I delivered a prioritized roadmap alongside the audit findings, with clear next steps the team could act on immediately versus plan for later. We kept regular check-ins through the engagement so nothing sat in a report unread — recommendations got discussed and adjusted as the team’s own thinking evolved.
  - name: Design + Deliver
    slug: design-deliver
    card_summary: You’ve got a product that works. This gets it to the level that impresses investors, converts users, and wins partners.
    preamble: '**Design + Deliver** is for products with a proven concept and needs to go from good to great for users, investors, or partners.'
    who_for: Early or late state startups with a working product who need senior design execution, not just direction.
    what_intro: 'The exact mix depends on the product and where it is in its lifecycle, but the work generally moves through three stages:'
    what_items:
      - title: 'Define:'
        body: Understanding the users, the constraints, and what great looks like for this product, translated into a direction the whole team can build against.
      - title: 'Design:'
        body: Wireframes, prototypes, and high-fidelity UI, tested and refined with real users along the way rather than delivered cold.
      - title: 'Deliver:'
        body: A design system and production-ready files, handed off with the specs and rationale your engineering team needs to build it right, with support through implementation.
    case_study: |-
      Traveling with Ease

      I’ve watched the same scene play out on every family trip: one person holds all the information, and everyone else is texting them for the Airbnb code, the flight number, which terminal to go to. I’ve stood in an airport digging through my own inbox trying to find that email that holds the QR code for the train while stressed and short on time. There had to be a better way to handle information that’s already sitting in your email.

      I looked at what existed. TripIt, Wanderlog, they solve the aggregation problem, but not the simplicity problem. I thought I could build something better, something simpler. With help from Claude Code, Claude Design, I built [Lakatta](lakatta.html). It pulls your confirmation emails into one itinerary that shows you only what you need for right now, with the rest of the trip a tap away. Weather’s built in. Shared trips and split expenses mean nobody’s re-sending hotel details in a group chat for the fifth time.
  - name: Direct + Develop
    slug: direct-develop
    card_summary: Design executive for teams that need someone who’s already navigated clinical, engineering, and exec stakeholders, without the headcount.
    preamble: '**Direct + Develop** is about having a senior design voice at your leadership table without the overhead of one. After years sitting in that seat myself — scaling design orgs and navigating clinical, marketing, product, and engineering stakeholders across health platforms serving millions of users. I am opening this to companies needing design leadership guidance, mentorship and creating design processes that help your business grow efficiently.'
    who_for: Early or late stage startups who need a design partner to help build their product and get it to the next level. I help founders and established companies work through the messy and fun part of ideation, uncovering what users need and want, and how that translates into business outcomes.
    what_intro: 'The exact mix depends on your team and stage. The engagement generally covers three things:'
    what_items:
      - title: 'Embed:'
        body: I fold into how your team actually works. Standups, roadmap reviews, stakeholder meetings. Direction comes from inside the work.
      - title: 'Direct:'
        body: I help you shape the product and design strategy, make the calls that keep design and engineering moving together, and represent the user in every room where decisions get made, including with clinical or executive stakeholders.
      - title: 'Develop:'
        body: "I build what outlasts the engagement: design systems, workflows, a practice your team can run on its own once it's time to bring someone in full-time."
    case_study: I’ve led design orgs and sat at the table with clinical, marketing, product, and engineering stakeholders across health platforms serving millions of users. Scaling the org, building the processes that get roadmap-critical work in front of the right people, and staying in the room through the trade-offs. That’s the same seat I take fractionally now, just without the full-time headcount.
